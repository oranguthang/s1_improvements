[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s1tools"
version = "0.1.0"
description = "Reproducible Sonic 1 resource transformations"
requires-python = ">=3.11"
dependencies = ["Pillow>=10"]

[project.optional-dependencies]
dev = ["ruff>=0.9", "pytest>=8"]

[project.scripts]
s1tools = "s1tools.__main__:main"

[tool.setuptools.packages.find]
where = ["tools"]
include = ["s1tools*"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
pythonpath = ["tools"]
testpaths = ["tests"]

[tool.setuptools.data-files]
"share/s1tools" = ["tools/data/*.json", "tools/data/source_inputs.zip"]
